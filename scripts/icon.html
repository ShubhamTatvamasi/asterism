<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}html,body{width:180px;height:180px;overflow:hidden}
body{display:grid;place-items:center;background:
radial-gradient(130px 120px at 24% 10%,#16223f,transparent 68%),
radial-gradient(120px 120px at 90% 96%,#251a34,transparent 70%),
#060810;}
.card{position:relative;width:180px;height:180px;display:grid;place-items:center;border-radius:0;
background:radial-gradient(80% 70% at 50% 40%,rgba(244,207,135,.10),transparent 66%);}
svg{width:108px;height:108px;fill:url(#g);filter:drop-shadow(0 0 18px rgba(244,207,135,.55))}
.dot{position:absolute;width:4px;height:4px;border-radius:50%;background:#f4cf87;box-shadow:0 0 8px rgba(244,207,135,.9)}
.d1{top:32px;left:38px}.d2{top:44px;right:36px;width:3px;height:3px;opacity:.7}.d3{bottom:38px;right:44px;width:3px;height:3px;opacity:.55}.d4{bottom:40px;left:36px;width:2px;height:2px;opacity:.6}
</style></head><body>
<div class="card">
<span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span><span class="dot d4"></span>
<svg viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffeec8"/><stop offset=".55" stop-color="#f4cf87"/><stop offset="1" stop-color="#dfa94f"/></linearGradient></defs><path d="M32 4c1.7 15.4 8.9 22.6 24.3 24.3C40.9 30 33.7 37.2 32 52.6 30.3 37.2 23.1 30 7.7 28.3 23.1 26.6 30.3 19.4 32 4Z"/></svg>
</div></body></html>
