<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background:
      radial-gradient(900px 560px at 12% -6%, #14203d 0%, transparent 64%),
      radial-gradient(760px 520px at 96% 108%, #21172f 0%, transparent 66%),
      #060810;
    color: #f2ead9;
  }
  .stars {
    position: absolute; inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,241,214,.9) 50%, transparent 52%),
      radial-gradient(1px 1px at 24% 72%, rgba(255,241,214,.55) 50%, transparent 52%),
      radial-gradient(1.2px 1.2px at 38% 24%, rgba(255,241,214,.6) 50%, transparent 52%),
      radial-gradient(1px 1px at 52% 82%, rgba(255,241,214,.45) 50%, transparent 52%),
      radial-gradient(1.4px 1.4px at 68% 12%, rgba(255,241,214,.5) 50%, transparent 52%),
      radial-gradient(1px 1px at 84% 62%, rgba(255,241,214,.4) 50%, transparent 52%),
      radial-gradient(1.6px 1.6px at 92% 30%, rgba(255,241,214,.55) 50%, transparent 52%),
      radial-gradient(1px 1px at 6% 88%, rgba(255,241,214,.5) 50%, transparent 52%),
      radial-gradient(1.2px 1.2px at 44% 52%, rgba(255,241,214,.35) 50%, transparent 52%),
      radial-gradient(1px 1px at 74% 90%, rgba(255,241,214,.35) 50%, transparent 52%);
  }
  .frame {
    position: absolute; inset: 34px;
    border: 1px solid rgba(244,236,220,.10);
    border-radius: 26px;
    background:
      radial-gradient(80% 70% at 74% 40%, rgba(84,104,160,.10), transparent 70%),
      linear-gradient(180deg, rgba(16,21,36,.72), rgba(7,10,18,.86));
  }
  .tick { position: absolute; width: 13px; height: 13px; border-style: solid; border-color: rgba(244,207,135,.42); }
  .tick.tl { top: 18px; left: 18px; border-width: 1px 0 0 1px; }
  .tick.tr { top: 18px; right: 18px; border-width: 1px 1px 0 0; }
  .tick.bl { bottom: 18px; left: 18px; border-width: 0 0 1px 1px; }
  .tick.br { bottom: 18px; right: 18px; border-width: 0 1px 1px 0; }
  .content { position: absolute; inset: 0; display: flex; align-items: center; gap: 60px; padding: 88px 92px; }
  .copy { width: 560px; flex: none; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 42px; }
  .brand svg { width: 22px; height: 22px; fill: #f4cf87; filter: drop-shadow(0 0 7px rgba(244,207,135,.6)); }
  .brand b { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-weight: 500; font-size: 25px; letter-spacing: .01em; }
  .brand span { margin-left: 12px; padding-left: 16px; border-left: 1px solid rgba(244,236,220,.18); color: #7d7869; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; }
  .eyebrow { color: #c29a5f; font-size: 11px; letter-spacing: .28em; text-transform: uppercase; }
  h1 { margin-top: 16px; font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-weight: 400; font-size: 66px; line-height: 1.02; letter-spacing: -.015em; }
  h1 em { font-style: italic; color: #f7dca3; }
  .lede { margin-top: 24px; max-width: 470px; color: #cfc6b3; font-size: 18px; line-height: 1.55; }
  .url { margin-top: 38px; display: flex; align-items: center; gap: 12px; color: #a7a08e; font-size: 13px; letter-spacing: .06em; }
  .url::before { content: ""; width: 34px; height: 1px; background: rgba(244,207,135,.45); }
  .board-shell { position: relative; width: 404px; height: 404px; padding: 14px; border: 1px solid rgba(244,236,220,.14); border-radius: 24px; background: linear-gradient(180deg, rgba(17,22,38,.94), rgba(8,11,19,.97)); box-shadow: 0 50px 100px -50px #000, 0 20px 40px -30px rgba(0,0,0,.9); }
  .board { display: grid; grid-template-columns: repeat(8, 1fr); width: 100%; height: 100%; overflow: hidden; border-radius: 8px; border: 1px solid rgba(244,236,220,.16); }
  .cell { position: relative; display: grid; place-items: center; }
  .cell svg { width: 54%; height: 54%; fill: #f7d79a; filter: drop-shadow(0 0 8px rgba(244,207,135,.8)); }
  .cell::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05); }
  .tally { position: absolute; top: 5px; right: 5px; display: flex; gap: 2px; }
  .tally i { width: 3px; height: 3px; border-radius: 50%; background: #f4cf87; box-shadow: 0 0 4px rgba(244,207,135,.8); }
  .caption { margin-top: 20px; text-align: center; color: #7d7869; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="frame">
    <span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
    <div class="content">
      <div class="copy">
        <div class="brand">
          <svg viewBox="0 0 24 24"><path d="M12 1.2c.9 6.2 4.6 9.9 10.8 10.8-6.2.9-9.9 4.6-10.8 10.8C11.1 16.6 7.4 12.9 1.2 12 7.4 11.1 11.1 7.4 12 1.2Z"/></svg>
          <b>Asterism</b><span>Daily star chart</span>
        </div>
        <p class="eyebrow">A quiet logic puzzle</p>
        <h1>Sixteen stars.<br><em>One sky.</em></h1>
        <p class="lede">Two stars in every row, column and constellation. No two may touch — not even at a corner.</p>
        <p class="url">shubhamtatvamasi.com/astro-game</p>
      </div>
      <div>
        <div class="board-shell"><div class="board" id="board"></div></div>
        <p class="caption">A new chart every day · 00:00 UTC</p>
      </div>
    </div>
  </div>
<script>
  const regions = [4,4,0,3,3,6,6,6,4,4,0,0,3,6,6,6,4,0,0,3,3,3,6,2,4,0,0,3,1,3,6,2,4,1,0,1,1,7,7,2,1,1,1,1,1,7,7,2,5,5,5,5,7,7,2,2,5,5,5,5,5,7,2,2];
  const palette = ['#4f7fd0','#9b63d6','#2f9e8f','#d1647f','#cf9a45','#6aa95f','#c1774f','#5b8ea8'];
  const stars = new Set([4,6,8,10,20,22,24,26,37,39,41,43,53,55,57,59]);
  const anchors = new Set();
  const board = document.getElementById('board');
  regions.forEach((r, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.background = `color-mix(in oklab, ${palette[r]} 30%, #080b14)`;
    if (stars.has(i)) cell.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 1.2c.9 6.2 4.6 9.9 10.8 10.8-6.2.9-9.9 4.6-10.8 10.8C11.1 16.6 7.4 12.9 1.2 12 7.4 11.1 11.1 7.4 12 1.2Z"/></svg>';
    if (!anchors.has(r)) { anchors.add(r); cell.insertAdjacentHTML('beforeend', '<span class="tally"><i></i><i></i></span>'); }
    board.append(cell);
  });
</script>
</body>
</html>
